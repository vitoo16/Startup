name: C03 Selected Image 21-Layer Draft

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/Stage-C03SelectedOwnerCutout.py
      - .github/workflows/c03-selected-layer-draft.yml
      - docs/evidence/production-art/C03-LATEST-MINOR-POLISH-REFERENCE.json
      - docs/evidence/production-art/C03-ACTIVE-OWNER-FRONT-RIG-CONTRACT.json

permissions:
  contents: read

concurrency:
  group: c03-selected-layer-draft-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft:
    name: Reproducible non-shipping owner-image layer study
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact C03 owner-selected source via Git LFS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - name: Install pinned draft authoring dependency
        run: python3 -m pip install --disable-pip-version-check --quiet Pillow==11.3.0
      - name: Validate exact selected source is present
        run: python3 scripts/Verify-C03HandBagReference.py
      - name: Export 21 source-pixel layer drafts and bag mask
        run: python3 scripts/Stage-C03SelectedOwnerCutout.py --output-dir "$RUNNER_TEMP/C03-selected-cutout-draft"
      - name: Validate source-exact draft receipt and 16 joints
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'C03-selected-cutout-draft'
          receipt=json.loads((p/'C03-selected-cutout-receipt.json').read_text())
          guide=json.loads((p/'C03-selected-16-joint-guide-DRAFT.json').read_text())
          assert receipt['status']=='REVIEW_ONLY_OPAQUE_IMAGE_EXTRACTION_NOT_NATIVE_RIG'
          assert receipt['reference_sha256']=='1999322a19bf99a5954edc3cf4fd87f6c6b9795006781c0c46ee4ff49fdc30fa'
          assert receipt['layer_count']==21
          assert receipt['composite_matches_visible_source_pixels'] is True
          assert receipt['approved_for_gameplay'] is False
          assert receipt['native_pixel_128x160'] is False
          assert guide['joint_count']==16 and guide['motion_clips']==[]
          assert guide['rig_approval'] is False
          assert len(receipt['file_sha256'])==22
          for name,sha in receipt['file_sha256'].items():
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==sha
          assert receipt['unassigned_foreground_fallback_px'] < .05*receipt['foreground_opaque_pixels']
          print('PASS C03 21 layer+mask, 16 joint study, no game/Unity approval')
          PY

      - name: Archive actual PNG layer sources for manual editing and review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c03-selected-owner-21-layer-draft-NOT-UNITY-READY
          path: ${{ runner.temp }}/C03-selected-cutout-draft/
          if-no-files-found: error
          retention-days: 30
