name: Engine-free CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Documentation, Unity contracts, security, and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Validate authoritative documentation
        shell: pwsh
        run: ./scripts/validate-documentation.ps1

      - name: Validate static Unity foundation
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/unity-foundation-report.json'
          ./scripts/Test-UnityFoundationStatic.ps1 -ReportPath $reportPath

      - name: Validate frozen M1 public API
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/m1-api-freeze-report.json'
          ./scripts/Test-M1ApiContractStatic.ps1 -ReportPath $reportPath

      - name: Validate Content bridge contract
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/content-bridge-static-report.json'
          ./scripts/Test-ContentBridgeStatic.ps1 -ReportPath $reportPath

      - name: Validate M7 first playable shell source
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/m7-first-playable-shell-static-report.json'
          ./scripts/Test-FirstPlayableShellStatic.ps1 -ReportPath $reportPath

      - name: Validate Unity runner contract
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/unity-runner-contract-report.json'
          ./scripts/Test-UnityRunnerContractStatic.ps1 -ReportPath $reportPath

      - name: Validate Unity result report parser with offline fixtures
        shell: pwsh
        run: ./tools/UnityReportChecks.ps1

      - name: Validate repository security and release hygiene
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/repository-security-report.json'
          ./scripts/Test-RepositorySecurityStatic.ps1 -ReportPath $reportPath

      - name: Validate pixel Golden contract (no Unity runtime)
        run: |
          python3 scripts/Validate-GoldenArt.py
          python3 -m unittest discover -s tools/GoldenArtChecks -p 'test_*.py' -v

      - name: Validate quarantined Golden C01 source (no Unity or IP approval)
        run: |
          python3 scripts/Validate-GoldenCharacter.py
          python3 -m unittest discover -s tools/GoldenCharacterChecks -p 'test_*.py' -v

      - name: Validate pixel UI palette consistency and contrast (no Unity)
        run: |
          python3 scripts/Validate-PixelUi.py
          python3 -m unittest discover -s tools/PixelUiChecks -p 'test_*.py' -v

      - name: Render quarantined Golden C01 preview and silhouette contact sheet
        run: |
          python3 scripts/Render-GoldenCharacterPreview.py --output "${RUNNER_TEMP}/startup-life/c01-front-draft.png"
          python3 -m unittest discover -s tools/GoldenCharacterPreviewChecks -p 'test_*.py' -v

      - name: Author and inspect quarantined Golden C02 four-view source sheet
        run: |
          python3 scripts/Validate-GoldenCharacterC02.py
          python3 -m unittest discover -s tools/GoldenCharacterC02Checks -p 'test_*.py' -v
          python3 scripts/Render-GoldenCharacterC02.py --output "${RUNNER_TEMP}/startup-life/c02-nine-candidates-4views-DRAFT.png" --report "${RUNNER_TEMP}/startup-life/c02-source-report.json"

      - name: Validate native first-party Golden C03 source (DRAFT only)
        run: |
          python3 scripts/Validate-GoldenCharacterC03.py
          python3 -m unittest discover -s tools/GoldenCharacterC03Checks -p 'test_*.py' -v
          python3 scripts/Render-GoldenCharacterC03.py --output "${RUNNER_TEMP}/startup-life/c03-3-styles-4-views-DRAFT.png" --fronts "${RUNNER_TEMP}/startup-life/c03-9-front-variants-DRAFT.png" --report "${RUNNER_TEMP}/startup-life/c03-source-report.json"

      - name: Validate C03 source migration and Idle V3 Unity staging (no Editor)
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'Pillow==11.3.0'
          python3 -m unittest discover -s tools/tests -p 'test_c03_authoring_source_migration.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_c03_idle_v3.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_c03_idle_v3_unity_staging.py' -v

      - name: Guard Unity 6.3 sprite import and responsive PlayMode compile contracts (no Editor)
        run: python3 -m unittest discover -s tools/tests -p 'test_unity63_local_compile_contract.py' -v

      - name: Guard opt-in Editor test-save diagnostics (no Unity Editor)
        run: python3 -m unittest discover -s tools/tests -p 'test_editor_save_diagnostics.py' -v

      - name: Guard UI motion and Vietnamese copy source joins (no Unity Editor)
        run: python3 -m unittest discover -s tools/tests -p 'test_presentation_motion_source.py' -v

      - name: Guard Life journal composition and approved-art boundary (no Unity Editor)
        run: python3 -m unittest discover -s tools/tests -p 'test_life_journal_source.py' -v

      - name: Verify player main-menu safety contracts (no Unity Editor)
        run: python3 -m unittest discover -s tools/tests -p 'test_main_menu_source.py' -v

      - name: Reject missing or mismatched main-menu screenshot evidence (synthetic fixtures only)
        run: python3 -m unittest discover -s tools/tests -p 'test_main_menu_evidence_validator.py' -v


      - name: Compile and exercise locked save archiver with real temporary files
        run: dotnet run --project tools/SaveArchiveChecks/SaveArchiveChecks.csproj -c Release

      - name: Triage Unity Console diagnostics without suppressing unknown errors (no Editor)
        run: python3 -m unittest discover -s tools/tests -p 'test_unity_console_triage.py' -v


      - name: Validate Unity character assembler source and quarantine (no Editor)
        run: |
          python3 scripts/Validate-CharacterVisualAssembler.py
          python3 -m unittest discover -s tools/CharacterAssemblerChecks -p 'test_*.py' -v

      - name: Compile and exercise Unity assembler logic against engine-free API stubs
        run: dotnet run --project tools/CharacterAssemblerCompileChecks/CharacterAssemblerCompileChecks.csproj --configuration Release --nologo

      - name: Validate data-only Character Creator options
        run: python3 scripts/Validate-CharacterCreatorCatalog.py

      - name: Validate responsive Character Creator wiring (no Unity Editor)
        run: |
          python3 scripts/Validate-CharacterCreatorUi.py
          python3 -m unittest discover -s tools/CharacterCreatorUiChecks -p 'test_*.py' -v

      - name: Verify authored Unity responsive matrix and forced scene reopen gate
        run: |
          python3 scripts/Validate-CharacterCreatorResponsiveMatrix.py
          python3 -m unittest discover -s tools/CharacterCreatorResponsiveChecks -p 'test_*.py' -v

      - name: Validate graphical Unity runner and 36 native responsive screenshot gate
        run: |
          python3 scripts/Validate-UnityCreatorGraphicalRunner.py
          python3 -m unittest discover -s tools/UnityCreatorGraphicalChecks -p 'test_*.py' -v

      - name: Validate approved-only character preview bridge and quarantine
        run: |
          python3 scripts/Validate-CharacterCreatorPreviewBridge.py
          python3 -m unittest discover -s tools/CharacterPreviewBridgeChecks -p 'test_*.py' -v

      - name: Validate asset provenance and approval join (no legal clearance implied)
        run: |
          python3 scripts/Validate-AssetProvenance.py
          python3 -m unittest discover -s tools/AssetProvenanceChecks -p 'test_*.py' -v

      - name: Run engine-free simulation regression suite
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/simulation-report.json'
          ./scripts/Test-Simulation.ps1 -ReportPath $reportPath

      - name: Verify checks did not mutate the repository
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Error "Verification changed tracked/worktree files:`n$changes"
          }

      - name: Upload engine-free foundation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-free-foundation-reports
          path: |
            ${{ runner.temp }}/startup-life/*.json
            ${{ runner.temp }}/startup-life/*.png
          if-no-files-found: warn
          retention-days: 14
