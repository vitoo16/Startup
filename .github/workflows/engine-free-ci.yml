name: Engine-free CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-free-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Documentation and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Validate authoritative documentation
        shell: pwsh
        run: ./scripts/validate-documentation.ps1

      - name: Run engine-free simulation regression suite
        shell: pwsh
        run: |
          $reportPath = Join-Path $env:RUNNER_TEMP 'startup-life/simulation-report.json'
          ./scripts/Test-Simulation.ps1 -ReportPath $reportPath

      - name: Verify checks did not mutate the repository
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            Write-Error "Verification changed tracked/worktree files:`n$changes"
          }

      - name: Upload simulation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-free-simulation-report
          path: ${{ runner.temp }}/startup-life/simulation-report.json
          if-no-files-found: warn
          retention-days: 14
